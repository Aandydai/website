<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>promise - Shall I compare thee to a summer's day?</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-size: cover;
      background-attachment: fixed;
      background-position: 50% 50%;
      background-repeat: no-repeat;
      transition: background-image 2s ease;
      background-image: url('/img/bg_fallback.jpg');
      font-family: Georgia, 'Noto Serif SC', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== Container ====== */
    #container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 90%;
      max-height: 80%;
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 1.5em;
      color: #fefefe;
      overflow: auto;
      padding: 2.5em 2em;
      text-align: center;
      transition: left 0.6s ease, top 0.6s ease, transform 0.6s ease,
                  width 0.6s ease, padding 0.6s ease, border-radius 0.6s ease;
      box-sizing: border-box;
    }

    /* ====== Fold Buttons ====== */
    .fold-btn {
      display: block;
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 60px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 50;
      padding: 0;
      opacity: 0.45;
      color: #fefefe;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      outline: none;
      transition: opacity 0.3s;
    }
    .fold-btn:hover { opacity: 1; }
    .fold-btn.left  { left: 0; }
    .fold-btn.right { right: 0; }

    .fold-btn.left::before  { content: '‹'; font-size: 42px; }
    .fold-btn.right::before { content: '›'; font-size: 42px; }

    /* Folded-left: card to left edge */
    body.folded-left #container {
      left: 0;
      top: 50%;
      transform: translate(0, -50%);
      width: 14px;
      min-width: 14px;
      overflow: hidden;
      padding: 0;
      border-radius: 0 1em 1em 0;
      max-height: 60vh;
    }
    body.folded-left #container:hover {
      background-color: rgba(254, 254, 254, 0.15);
    }
    body.folded-left .fold-btn.left  { opacity: 0; pointer-events: none; }
    body.folded-left .fold-btn.right { left: 14px; right: auto; opacity: 0.6; }
    body.folded-left .fold-btn.right::before { content: '›'; }

    /* Folded-right: card to right edge */
    body.folded-right #container {
      left: auto;
      right: 0;
      top: 50%;
      transform: translate(0, -50%);
      width: 14px;
      min-width: 14px;
      overflow: hidden;
      padding: 0;
      border-radius: 1em 0 0 1em;
      max-height: 60vh;
    }
    body.folded-right #container:hover {
      background-color: rgba(254, 254, 254, 0.15);
    }
    body.folded-right .fold-btn.right { opacity: 0; pointer-events: none; }
    body.folded-right .fold-btn.left  { left: auto; right: 14px; opacity: 0.6; }
    body.folded-right .fold-btn.left::before { content: '‹'; }

    /* ====== Header ====== */
    #header h1 {
      font-size: 2rem;
      font-weight: bolder;
      color: #fefefe;
      text-shadow: 0 1px 2px #333;
      cursor: pointer;
      margin: 0 0 0.3em 0;
      letter-spacing: 0.02em;
      transition: color 0.2s;
      user-select: none;
    }
    #header h1:hover {
      color: #ccc;
    }
    #header p {
      color: #fefefe;
      text-shadow: 0 1px 1px #333;
      margin: 0 0 1.8em 0;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    /* ====== Nav Links ====== */
    #nav-links p {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 0.35em 0.6em;
      border-radius: 0.5em;
      margin: 0.6em 0;
      transition: background 0.2s;
    }
    #nav-links p:hover {
      background-color: #fefefe;
    }
    #nav-links p:hover a {
      color: #222;
      text-shadow: none;
    }
    #nav-links a {
      color: #fefefe;
      text-decoration: none;
      text-shadow: 0 1px 1px #333;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    /* ====== Footer ====== */
    #footer {
      margin-top: 1.8em;
    }
    #footer p {
      color: #fefefe;
      text-shadow: 0 1px 1px #333;
      font-size: 0.85rem;
    }
    #footer a {
      color: #fefefe;
      text-decoration: none;
    }
    #footer a:hover {
      text-decoration: underline;
    }

    /* ====== Responsive ====== */
    @media (min-width: 641px) and (max-width: 770px) {
      #container { min-width: 70%; }
    }
    @media (min-width: 771px) {
      #container { min-width: 40%; max-width: 500px; }
    }

    @media (max-width: 640px) {
      #container {
        min-width: 90%;
        padding: 1.8em 1.2em;
      }
      #header h1 { font-size: 1.6rem; }
      #nav-links a { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <button id="fold-btn-left"  class="fold-btn left"  type="button" title="折叠到左边"></button>
  <button id="fold-btn-right" class="fold-btn right" type="button" title="折叠到右边"></button>

  <div id="container">
    <div id="header">
      <h1 title="点击切换背景">promise</h1>
      <p>Shall I compare thee to a summer's day?</p>
    </div>
    <div id="nav-links">
      <p><a href="/posts">posts</a></p>
      <p><a href="/categories">categories</a></p>
      <p><a href="/links">links</a></p>
      <p><a href="/about">about</a></p>
    </div>
    <div id="footer">
      <p><a href="mailto:contact@daishutao.online">Contact</a> | daishutao.online</p>
    </div>
  </div>

  <script src="/js/home.js"></script>
</body>
</html>
