<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>promise - Shall I compare thee to a summer's day?</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-size: cover;
      background-attachment: fixed;
      background-position: 50% 50%;
      background-repeat: no-repeat;
      transition: background-image 2s ease;
      background-image: url('/img/bg_fallback.jpg');
      font-family: Georgia, 'Noto Serif SC', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== Fold Buttons ====== */
    .fold-btn {
      position: fixed;
      top: 50%;
      width: 28px;
      height: 28px;
      background: rgba(254, 254, 254, 0.7);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: top 0.5s ease, transform 0.5s ease, background 0.2s;
      padding: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .fold-btn:hover {
      background: rgba(254, 254, 254, 0.95);
    }
    .fold-btn.left  { left: 20px; }
    .fold-btn.right { right: 20px; }

    /* Arrow icon: points inward (left arrow for left btn, right arrow for right btn) */
    .fold-btn.left::before {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 9px solid #555;
    }
    .fold-btn.right::before {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid #555;
    }

    /* Folded state: buttons near top, arrows flip outward */
    body.folded .fold-btn {
      top: 10px;
      transform: rotate(180deg);
    }

    /* ====== Container ====== */
    #container {
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 1.5em;
      color: #fefefe;
      overflow: auto;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 90%;
      max-height: 80%;
      padding: 2.5em 2em;
      text-align: center;
      transition: height 1s ease, top 1s ease, min-width 0.5s ease;
      box-sizing: border-box;
    }

    /* Folded: container shrinks */
    body.folded #container {
      top: 0;
      margin-top: 0;
      height: 6px;
      overflow: hidden;
      padding: 0;
      border-radius: 0 0 1.5em 1.5em;
    }

    /* ====== Header ====== */
    #header h1 {
      font-size: 2rem;
      font-weight: bolder;
      color: #fefefe;
      text-shadow: 0 1px 2px #333;
      cursor: pointer;
      margin: 0 0 0.3em 0;
      letter-spacing: 0.02em;
      transition: color 0.2s;
      user-select: none;
    }
    #header h1:hover {
      color: #ccc;
    }
    #header p {
      color: #fefefe;
      text-shadow: 0 1px 1px #333;
      margin: 0 0 1.8em 0;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    /* ====== Nav Links ====== */
    #nav-links p {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 0.35em 0.6em;
      border-radius: 0.5em;
      margin: 0.6em 0;
      transition: background 0.2s;
    }
    #nav-links p:hover {
      background-color: #fefefe;
    }
    #nav-links p:hover a {
      color: #222;
      text-shadow: none;
    }
    #nav-links a {
      color: #fefefe;
      text-decoration: none;
      text-shadow: 0 1px 1px #333;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    /* ====== Footer ====== */
    #footer {
      margin-top: 1.8em;
    }
    #footer p {
      color: #fefefe;
      text-shadow: 0 1px 1px #333;
      font-size: 0.85rem;
    }
    #footer a {
      color: #fefefe;
      text-decoration: none;
    }
    #footer a:hover {
      text-decoration: underline;
    }

    /* ====== Responsive ====== */
    @media (min-width: 641px) and (max-width: 770px) {
      #container { min-width: 70%; }
    }
    @media (min-width: 771px) {
      #container { min-width: 40%; max-width: 500px; }
    }

    @media (max-width: 640px) {
      #container {
        min-width: 90%;
        padding: 1.8em 1.2em;
      }
      #header h1 { font-size: 1.6rem; }
      #nav-links a { font-size: 1rem; }
      .fold-btn.left  { left: 8px; }
      .fold-btn.right { right: 8px; }
    }
  </style>
</head>
<body>

  <button id="fold-btn-left"  class="fold-btn left"  title="折叠/展开"></button>
  <button id="fold-btn-right" class="fold-btn right" title="折叠/展开"></button>

  <div id="container">
    <div id="header">
      <h1 onclick="changeBg()" title="点击切换背景">promise</h1>
      <p>Shall I compare thee to a summer's day?</p>
    </div>
    <div id="nav-links">
      <p><a href="/posts">» posts</a></p>
      <p><a href="/categories">» categories</a></p>
      <p><a href="/link">» link</a></p>
      <p><a href="/about">» about</a></p>
    </div>
    <div id="footer">
      <p><a href="mailto:contact@daishutao.online">Contact</a> | daishutao.online</p>
    </div>
  </div>

  <script>
    (function() {
      var currentBgUrl = '';
      var preloadedUrl = '';
      var preloadedImg = null;
      var bgList = [];
      var listLoaded = false;

      // Fetch image list from server proxy (cached server-side)
      function loadImageList() {
        if (listLoaded && bgList.length > 0) return Promise.resolve(bgList);
        return fetch('/api/random-bg/list')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            bgList = data.urls || [];
            listLoaded = true;
            return bgList;
          })
          .catch(function() {
            // Fallback: hardcoded Picsum IDs
            bgList = [
              'https://picsum.photos/id/1015/1920/1080',
              'https://picsum.photos/id/1016/1920/1080',
              'https://picsum.photos/id/1018/1920/1080',
              'https://picsum.photos/id/1020/1920/1080',
              'https://picsum.photos/id/1025/1920/1080',
              'https://picsum.photos/id/1035/1920/1080',
              'https://picsum.photos/id/1039/1920/1080',
              'https://picsum.photos/id/1043/1920/1080',
              'https://picsum.photos/id/1049/1920/1080',
              'https://picsum.photos/id/1051/1920/1080',
              'https://picsum.photos/id/1069/1920/1080',
              'https://picsum.photos/id/1076/1920/1080',
              'https://picsum.photos/id/1084/1920/1080',
              'https://picsum.photos/id/1094/1920/1080',
              'https://picsum.photos/id/1103/1920/1080',
              'https://picsum.photos/id/1115/1920/1080',
              'https://picsum.photos/id/1128/1920/1080',
              'https://picsum.photos/id/1138/1920/1080',
              'https://picsum.photos/id/1147/1920/1080',
              'https://picsum.photos/id/1159/1920/1080'
            ];
            listLoaded = true;
            return bgList;
          });
      }

      function randomUrl() {
        return bgList[Math.floor(Math.random() * bgList.length)];
      }

      function setBodyBg(url) {
        document.body.style.backgroundImage = 'url(' + url + ')';
        currentBgUrl = url;
      }

      function preloadNext() {
        loadImageList().then(function() {
          var url = randomUrl();
          preloadedImg = new Image();
          preloadedImg.onload = function() {
            preloadedUrl = url;
          };
          preloadedImg.src = url;
        });
      }

      window.changeBg = function() {
        if (preloadedUrl) {
          setBodyBg(preloadedUrl);
          preloadedUrl = '';
          preloadedImg = null;
          preloadNext();
        } else {
          loadImageList().then(function() {
            setBodyBg(randomUrl());
            preloadNext();
          });
        }
      };

      // Init: set first background
      loadImageList().then(function() {
        setBodyBg(randomUrl());
        preloadNext();
      });

      // ====== Fold / Unfold ======
      var folded = false;
      var leftBtn = document.getElementById('fold-btn-left');
      var rightBtn = document.getElementById('fold-btn-right');

      function toggleFold() {
        folded = !folded;
        if (folded) {
          document.body.classList.add('folded');
        } else {
          document.body.classList.remove('folded');
        }
      }

      leftBtn.addEventListener('click', toggleFold);
      rightBtn.addEventListener('click', toggleFold);
    })();
  </script>
</body>
</html>
