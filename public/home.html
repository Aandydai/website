<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>promise - Shall I compare thee to a summer's day?</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-size: cover;
      background-attachment: fixed;
      background-position: 50% 50%;
      background-repeat: no-repeat;
      transition: background-image 2s ease;
      background-image: url('/img/bg_fallback.jpg');
      font-family: Georgia, 'Noto Serif SC', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== Wrapper: centers the card + buttons as a group ====== */
    #wrapper {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 90%;
      max-height: 80%;
      transition: left 0.6s ease, top 0.6s ease, transform 0.6s ease;
    }

    /* ====== Fold Buttons: subtle, no background ====== */
    .fold-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 48px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
      padding: 0;
      opacity: 0.25;
      font-size: 18px;
      color: #fefefe;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .fold-btn:hover {
      opacity: 0.8;
    }
    .fold-btn.left  { left: -22px; }
    .fold-btn.right { right: -22px; }

    .fold-btn.left::before  { content: '\2039'; font-size: 32px; line-height: 1; }
    .fold-btn.right::before { content: '\203A'; font-size: 32px; line-height: 1; }

    /* Folded-left: card slides to left edge */
    body.folded-left #wrapper {
      left: 0;
      top: 50%;
      transform: translate(0, -50%);
      min-width: auto;
    }
    body.folded-left #container {
      width: 8px;
      min-width: auto;
      overflow: hidden;
      padding: 0;
      border-radius: 0 1em 1em 0;
      max-height: 60vh;
    }
    body.folded-left .fold-btn { display: none; }

    /* Folded-right: card slides to right edge */
    body.folded-right #wrapper {
      left: auto;
      right: 0;
      top: 50%;
      transform: translate(0, -50%);
      min-width: auto;
    }
    body.folded-right #container {
      width: 8px;
      min-width: auto;
      overflow: hidden;
      padding: 0;
      border-radius: 1em 0 0 1em;
      max-height: 60vh;
    }
    body.folded-right .fold-btn { display: none; }

    /* ====== Container ====== */
    #container {
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 1.5em;
      color: #fefefe;
      overflow: auto;
      max-height: 80vh;
      padding: 2.5em 2em;
      text-align: center;
      transition: width 0.6s ease, min-width 0.6s ease, padding 0.6s ease, border-radius 0.6s ease;
      box-sizing: border-box;
    }

    /* Unfold hint: show a thin bar to click */
    body.folded-left #container::after,
    body.folded-right #container::after {
      content: '';
      display: block;
      width: 8px;
      height: 100%;
    }

    /* ====== Header ====== */
    #header h1 {
      font-size: 2rem;
      font-weight: bolder;
      color: #fefefe;
      text-shadow: 0 1px 2px #333;
      cursor: pointer;
      margin: 0 0 0.3em 0;
      letter-spacing: 0.02em;
      transition: color 0.2s;
      user-select: none;
    }
    #header h1:hover {
      color: #ccc;
    }
    #header p {
      color: #fefefe;
      text-shadow: 0 1px 1px #333;
      margin: 0 0 1.8em 0;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    /* ====== Nav Links ====== */
    #nav-links p {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 0.35em 0.6em;
      border-radius: 0.5em;
      margin: 0.6em 0;
      transition: background 0.2s;
    }
    #nav-links p:hover {
      background-color: #fefefe;
    }
    #nav-links p:hover a {
      color: #222;
      text-shadow: none;
    }
    #nav-links a {
      color: #fefefe;
      text-decoration: none;
      text-shadow: 0 1px 1px #333;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    /* ====== Footer ====== */
    #footer {
      margin-top: 1.8em;
    }
    #footer p {
      color: #fefefe;
      text-shadow: 0 1px 1px #333;
      font-size: 0.85rem;
    }
    #footer a {
      color: #fefefe;
      text-decoration: none;
    }
    #footer a:hover {
      text-decoration: underline;
    }

    /* ====== Responsive ====== */
    @media (min-width: 641px) and (max-width: 770px) {
      #wrapper { min-width: 70%; }
    }
    @media (min-width: 771px) {
      #wrapper { min-width: 40%; max-width: 500px; }
    }

    @media (max-width: 640px) {
      #wrapper { min-width: 90%; }
      #container {
        padding: 1.8em 1.2em;
      }
      #header h1 { font-size: 1.6rem; }
      #nav-links a { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div id="wrapper">
    <button id="fold-btn-left"  class="fold-btn left"  title="折叠/展开"></button>
    <button id="fold-btn-right" class="fold-btn right" title="折叠/展开"></button>

    <div id="container">
      <div id="header">
        <h1 onclick="changeBg()" title="点击切换背景">promise</h1>
        <p>Shall I compare thee to a summer's day?</p>
      </div>
      <div id="nav-links">
        <p><a href="/posts">posts</a></p>
        <p><a href="/categories">categories</a></p>
        <p><a href="/links">links</a></p>
        <p><a href="/about">about</a></p>
      </div>
      <div id="footer">
        <p><a href="mailto:contact@daishutao.online">Contact</a> | daishutao.online</p>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var currentBgUrl = '';
      var preloadedUrl = '';
      var preloadedImg = null;
      var bgList = [];
      var listLoaded = false;

      // Fetch image list from server proxy (cached server-side)
      function loadImageList() {
        if (listLoaded && bgList.length > 0) return Promise.resolve(bgList);
        return fetch('/api/random-bg/list')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            bgList = data.urls || [];
            listLoaded = true;
            return bgList;
          })
          .catch(function() {
            // Fallback: hardcoded Picsum IDs
            bgList = [
              'https://picsum.photos/id/1015/1920/1080',
              'https://picsum.photos/id/1016/1920/1080',
              'https://picsum.photos/id/1018/1920/1080',
              'https://picsum.photos/id/1020/1920/1080',
              'https://picsum.photos/id/1025/1920/1080',
              'https://picsum.photos/id/1035/1920/1080',
              'https://picsum.photos/id/1039/1920/1080',
              'https://picsum.photos/id/1043/1920/1080',
              'https://picsum.photos/id/1049/1920/1080',
              'https://picsum.photos/id/1051/1920/1080',
              'https://picsum.photos/id/1069/1920/1080',
              'https://picsum.photos/id/1076/1920/1080',
              'https://picsum.photos/id/1084/1920/1080',
              'https://picsum.photos/id/1094/1920/1080',
              'https://picsum.photos/id/1103/1920/1080',
              'https://picsum.photos/id/1115/1920/1080',
              'https://picsum.photos/id/1128/1920/1080',
              'https://picsum.photos/id/1138/1920/1080',
              'https://picsum.photos/id/1147/1920/1080',
              'https://picsum.photos/id/1159/1920/1080'
            ];
            listLoaded = true;
            return bgList;
          });
      }

      function randomUrl() {
        return bgList[Math.floor(Math.random() * bgList.length)];
      }

      function setBodyBg(url) {
        document.body.style.backgroundImage = 'url(' + url + ')';
        currentBgUrl = url;
      }

      function preloadNext() {
        loadImageList().then(function() {
          var url = randomUrl();
          preloadedImg = new Image();
          preloadedImg.onload = function() {
            preloadedUrl = url;
          };
          preloadedImg.src = url;
        });
      }

      window.changeBg = function() {
        if (preloadedUrl) {
          setBodyBg(preloadedUrl);
          preloadedUrl = '';
          preloadedImg = null;
          preloadNext();
        } else {
          loadImageList().then(function() {
            setBodyBg(randomUrl());
            preloadNext();
          });
        }
      };

      // Init: set first background
      loadImageList().then(function() {
        setBodyBg(randomUrl());
        preloadNext();
      });

      // ====== Fold / Unfold (directional) ======
      var foldState = null; // 'left' | 'right' | null
      var leftBtn = document.getElementById('fold-btn-left');
      var rightBtn = document.getElementById('fold-btn-right');
      var container = document.getElementById('container');

      function foldTo(side) {
        if (foldState === side) {
          // Unfold
          document.body.classList.remove('folded-left', 'folded-right');
          foldState = null;
        } else {
          document.body.classList.remove('folded-left', 'folded-right');
          document.body.classList.add('folded-' + side);
          foldState = side;
        }
      }

      // Click the thin bar to unfold
      container.addEventListener('click', function(e) {
        if (foldState && e.target === container) {
          document.body.classList.remove('folded-left', 'folded-right');
          foldState = null;
        }
      });

      leftBtn.addEventListener('click', function() { foldTo('left'); });
      rightBtn.addEventListener('click', function() { foldTo('right'); });
    })();
  </script>
</body>
</html>
