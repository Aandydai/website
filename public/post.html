<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title id="page-title">Post - promise</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <a href="/" class="site-title">promise</a>
      <img class="site-subtitle" src="/img/subtitle.svg" alt="Shall I compare thee to a summer's day?">
    </div>
    <nav class="nav">
      <div class="nav-right">
        <a href="https://www.daishutao.online">Home</a>
        <a href="/posts">Posts</a>
        <a href="/categories">Categories</a>
        <a href="/vocabulary">Vocabulary</a>
        <a href="/listening">Listening</a>
        <a href="/speaking">Speaking</a>
        <a href="/reading">Reading</a>
        <a href="/writing">Writing</a>
        <a href="/viewing">Viewing</a>
        <a href="/aibb">AIBB</a>
        <a href="/links">Links</a>
        <a href="/about">About</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <!-- Password form -->
    <div id="password-form" class="password-form" style="display:none;">
      <h3>🔒 This content is password protected</h3>
      <p style="font-size:13px;color:#666;margin-bottom:16px;">Please enter the password to access this post</p>
      <input type="hidden" id="password-slug" value="">
      <input type="password" id="password-input" placeholder="Enter password...">
      <div id="password-error" style="color:#c00;font-size:13px;margin-bottom:8px;display:none;"></div>
      <button class="btn" id="verify-password-btn">Unlock</button>
    </div>

    <!-- Post body -->
    <article id="post-body" class="post-detail" style="display:none;">
      <h1 id="post-title" class="post-title"></h1>
      <div id="post-meta" class="post-meta"></div>
      <div id="post-content" class="post-content"></div>
    </article>

    <!-- Comments -->
    <section id="post-comments" class="comments-section" style="display:none;">
      <h2 id="comments-title" class="comments-title">No comments yet</h2>
      <div id="comments-list"></div>

      <div class="comment-form">
        <h3>Leave a Comment</h3>
        <div class="form-group">
          <label>Nickname *</label>
          <input type="text" id="comment-author" placeholder="Your nickname">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="comment-email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Website (optional)</label>
          <input type="text" id="comment-url" placeholder="http://">
        </div>
        <div class="form-group">
          <label>Comment *</label>
          <textarea id="comment-content" placeholder="Say something..."></textarea>
        </div>
        <button class="btn" id="submit-comment-btn">Submit</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/posts">Posts</a>
      <a href="/rss.xml" target="_blank">RSS</a>
      <a href="/archive">Archive</a>
    </div>
    <div id="footer-info">© promise</div>
  </footer>

  <div id="back-to-top" class="back-to-top" title="Back to top"></div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
