<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - promise</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <a href="/" class="site-title">promise</a>
      <img class="site-subtitle" src="/img/subtitle.svg" alt="Shall I compare thee to a summer's day?" onclick="openSearch()">
    </div>
    <nav class="nav">
      <div class="nav-right">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/link">Link</a>
        <a href="/admin">Admin</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <div class="page-content">
      <h1>Archive</h1>
      <div id="archive-list" class="archive-list">
        <p style="color:#999;">Loading...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="/rss.xml" target="_blank">Posts RSS</a>
      <a href="/archive">Archive</a>
    </div>
    <div>© promise</div>
  </footer>

  <div id="back-to-top" class="back-to-top" title="Back to top"></div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/api/archive').then(r => r.json()).then(data => {
        const listEl = document.getElementById('archive-list');
        listEl.innerHTML = '';
        for (const [month, posts] of Object.entries(data.archive)) {
          const group = document.createElement('div');
          group.className = 'archive-group';
          group.innerHTML = '<h3>' + month + '</h3>';
          for (const post of posts) {
            const item = document.createElement('div');
            item.className = 'archive-item';
            item.innerHTML = '<span class="date">' + post.created_at + '</span><a href="/post/' + post.slug + '">' + escapeHtml(post.title) + '</a>';
            group.appendChild(item);
          }
          listEl.appendChild(group);
        }
      });
    });
  </script>
</body>
</html>
