<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link - promise</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <a href="/" class="site-title">promise</a>
      <img class="site-subtitle" src="/img/subtitle.svg" alt="Shall I compare thee to a summer's day?" onclick="openSearch()">
    </div>
    <nav class="nav">
      <div class="nav-right">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/link" class="active">Link</a>
        <a href="/admin">Admin</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <div class="page-content">
      <h1>Link</h1>
      <p style="color:#999;margin-bottom:32px;">People and sites I like.</p>
      <div id="friends-list" class="friends-list">
        <p style="color:#999;">Loading...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="/rss.xml" target="_blank">Posts RSS</a>
      <a href="/archive">Archive</a>
    </div>
    <div>© promise</div>
  </footer>

  <div id="back-to-top" class="back-to-top" title="Back to top"></div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/api/friends').then(r => r.json()).then(data => {
        const listEl = document.getElementById('friends-list');
        if (data.friends.length === 0) {
          listEl.innerHTML = '<p style="color:#999;">No friends links yet.</p>';
          return;
        }
        listEl.innerHTML = '';
        for (const f of data.friends) {
          const card = document.createElement('div');
          card.className = 'friend-card';
          card.innerHTML = '<h3><a href="' + f.url + '" target="_blank">' + escapeHtml(f.name) + '</a></h3><p>' + escapeHtml(f.description || '') + '</p>';
          listEl.appendChild(card);
        }
      });
    });
  </script>
</body>
</html>
