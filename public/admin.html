<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - promise</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="login-container">
    <h2>🔐 Admin Login</h2>
    <div id="login-error" class="login-error"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;" onclick="handleLogin()">Login</button>
    <p style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="/">← Back to Home</a>
    </p>
  </div>

  <script>
    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        document.getElementById('login-error').textContent = 'Please enter username and password';
        document.getElementById('login-error').style.display = 'block';
        return;
      }

      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      }).then(r => r.json()).then(data => {
        if (data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          document.getElementById('login-error').textContent = data.error || 'Wrong username or password';
          document.getElementById('login-error').style.display = 'block';
        }
      }).catch(() => {
        document.getElementById('login-error').textContent = 'Login failed, please try again';
        document.getElementById('login-error').style.display = 'block';
      });
    }

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>
</html>
