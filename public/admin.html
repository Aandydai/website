<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Admin Login - promise</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="login-container">
    <h2>🔐 Admin Login</h2>
    <div id="login-error" class="login-error"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="form-group">
      <div id="turnstile-widget" style="display:flex;justify-content:center;margin-bottom:12px;"></div>
    </div>
    <div class="form-group">
      <label>Verification Code</label>
      <input type="text" id="totp-input" placeholder="6-digit Authenticator code" maxlength="6" style="text-align:center;font-size:18px;letter-spacing:4px;" inputmode="numeric" autocomplete="one-time-code">
    </div>
    <button class="btn" id="login-btn" style="width:100%;">Login</button>
    <p style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="/">← Back to Home</a>
    </p>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
